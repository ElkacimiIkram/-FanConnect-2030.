<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" width="1400" height="1180">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F9F58"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1400" height="1180" fill="#FFFFFF"/>
  <rect width="1400" height="58" fill="#111827"/>
  <text x="700" y="24" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#FFFFFF">Diagramme de séquence — Authentification JWT</text>
  <text x="700" y="46" text-anchor="middle" font-family="Arial" font-size="12" fill="#A7F3D0">UC01 S'inscrire  ·  UC02 S'authentifier  ·  UML 2.5  ·  messages numérotés  ·  alt = branches</text>

  <!-- participants -->
  <g font-family="Arial" font-size="12" text-anchor="middle">
    <rect x="40" y="76" width="120" height="48" rx="6" fill="#ECFDF3" stroke="#0F9F58"/>
    <text x="100" y="96" font-weight="700" fill="#065F46">Utilisateur</text>
    <text x="100" y="112" fill="#047857">Fan / Owner</text>
    <rect x="250" y="76" width="160" height="48" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="330" y="96" font-weight="700">Frontend React</text>
    <text x="330" y="112" fill="#64748B">AuthContext</text>
    <rect x="500" y="76" width="170" height="48" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="585" y="96" font-weight="700">AuthController</text>
    <text x="585" y="112" fill="#64748B">POST /auth</text>
    <rect x="760" y="76" width="170" height="48" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="845" y="96" font-weight="700">AuthService</text>
    <text x="845" y="112" fill="#64748B">+ BCrypt</text>
    <rect x="1020" y="76" width="150" height="48" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="1095" y="96" font-weight="700">JwtService</text>
    <rect x="1220" y="76" width="140" height="48" rx="4" fill="#F1F5F9" stroke="#1A2332"/>
    <text x="1290" y="96" font-weight="700">PostgreSQL</text>
    <text x="1290" y="112" fill="#64748B">users</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="100" y1="124" x2="100" y2="1020"/>
    <line x1="330" y1="124" x2="330" y2="1020"/>
    <line x1="585" y1="124" x2="585" y2="1020"/>
    <line x1="845" y1="124" x2="845" y2="1020"/>
    <line x1="1095" y1="124" x2="1095" y2="1020"/>
    <line x1="1290" y1="124" x2="1290" y2="1020"/>
  </g>

  <!-- frames -->
  <rect x="30" y="140" width="1340" height="28" rx="4" fill="#111827"/>
  <text x="700" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF" font-weight="700">Inscription (UC01) — rôles Fan ou Owner uniquement</text>

  <g font-family="Arial" font-size="12">
    <text x="20" y="196" fill="#64748B" font-size="11">1</text>
    <line x1="100" y1="192" x2="330" y2="192" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="120" y="186" fill="#0F172A">formulaire email, mot de passe, rôle, ville</text>

    <text x="20" y="226" fill="#64748B" font-size="11">2</text>
    <line x1="330" y1="222" x2="585" y2="222" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="350" y="216" fill="#0F172A">POST /auth/register</text>

    <text x="20" y="256" fill="#64748B" font-size="11">3</text>
    <line x1="585" y1="252" x2="845" y2="252" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="605" y="246" fill="#0F172A">register(request)</text>

    <text x="20" y="286" fill="#64748B" font-size="11">4</text>
    <line x1="845" y1="282" x2="1290" y2="282" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="865" y="276" fill="#0F172A">existsByEmail(email)</text>

    <text x="20" y="316" fill="#64748B" font-size="11">5</text>
    <line x1="1290" y1="312" x2="845" y2="312" stroke="#64748B" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="980" y="306" fill="#64748B">false / true</text>
  </g>

  <rect x="560" y="330" width="800" height="150" rx="4" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-dasharray="6 3"/>
  <text x="572" y="348" font-family="Arial" font-size="11" font-weight="700" fill="#D97706">alt</text>

  <g font-family="Arial" font-size="12">
    <text x="580" y="368" fill="#9A3412" font-size="11">[email déjà utilisé OU rôle = ADMIN]</text>
    <text x="20" y="392" fill="#64748B" font-size="11">6</text>
    <line x1="845" y1="388" x2="330" y2="388" stroke="#DC2626" stroke-width="1.4" marker-end="url(#r)"/>
    <text x="400" y="382" fill="#DC2626">400 BusinessException</text>

    <line x1="570" y1="404" x2="1348" y2="404" stroke="#D97706" stroke-dasharray="4 3"/>
    <text x="580" y="420" fill="#065F46" font-size="11">[OK]</text>
    <text x="20" y="444" fill="#64748B" font-size="11">7</text>
    <line x1="845" y1="440" x2="845" y2="440" stroke="#0F9F58"/>
    <text x="860" y="438" fill="#0F172A">BCrypt.encode(password)  →  INSERT User enabled=true</text>
    <text x="20" y="468" fill="#64748B" font-size="11">8</text>
    <line x1="845" y1="464" x2="1095" y2="464" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="860" y="458" fill="#0F172A">generateToken(email, role)</text>
  </g>

  <g font-family="Arial" font-size="12">
    <text x="20" y="504" fill="#64748B" font-size="11">9</text>
    <line x1="1095" y1="500" x2="845" y2="500" stroke="#64748B" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="900" y="494" fill="#64748B">JWT HS256 (sub, role, exp)</text>
    <text x="20" y="534" fill="#64748B" font-size="11">10</text>
    <line x1="845" y1="530" x2="330" y2="530" stroke="#64748B" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="400" y="524" fill="#64748B">201 AuthResponse { token, user }</text>
    <text x="20" y="564" fill="#64748B" font-size="11">11</text>
    <line x1="330" y1="560" x2="330" y2="560"/>
    <text x="340" y="558" fill="#0F172A">localStorage ← token + user</text>
  </g>

  <rect x="30" y="580" width="1340" height="28" rx="4" fill="#111827"/>
  <text x="700" y="600" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF" font-weight="700">Connexion (UC02)</text>

  <g font-family="Arial" font-size="12">
    <text x="20" y="636" fill="#64748B" font-size="11">12</text>
    <line x1="100" y1="632" x2="330" y2="632" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="120" y="626" fill="#0F172A">email + mot de passe</text>
    <text x="20" y="666" fill="#64748B" font-size="11">13</text>
    <line x1="330" y1="662" x2="585" y2="662" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="350" y="656" fill="#0F172A">POST /auth/login</text>
    <text x="20" y="696" fill="#64748B" font-size="11">14</text>
    <line x1="585" y1="692" x2="845" y2="692" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="605" y="686" fill="#0F172A">login() → AuthenticationManager</text>
    <text x="20" y="726" fill="#64748B" font-size="11">15</text>
    <line x1="845" y1="722" x2="1290" y2="722" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="900" y="716" fill="#0F172A">SELECT user + hash BCrypt</text>
  </g>

  <rect x="560" y="740" width="800" height="100" rx="4" fill="#FFFBEB" fill-opacity="0.45" stroke="#D97706" stroke-dasharray="6 3"/>
  <text x="572" y="758" font-family="Arial" font-size="11" font-weight="700" fill="#D97706">alt  [identifiants invalides]  /  [OK]</text>
  <g font-family="Arial" font-size="12">
    <text x="20" y="784" fill="#64748B" font-size="11">16</text>
    <line x1="845" y1="780" x2="330" y2="780" stroke="#DC2626" stroke-width="1.3" marker-end="url(#r)"/>
    <text x="400" y="774" fill="#DC2626">401  ou  200 + JWT Bearer</text>
  </g>

  <rect x="30" y="860" width="1340" height="28" rx="4" fill="#111827"/>
  <text x="700" y="880" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF" font-weight="700">Requête métier suivante — JwtAuthenticationFilter</text>
  <g font-family="Arial" font-size="12">
    <text x="20" y="916" fill="#64748B" font-size="11">17</text>
    <line x1="330" y1="912" x2="585" y2="912" stroke="#0F9F58" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="340" y="906" fill="#0F172A">Authorization: Bearer JWT    /fan/**  /owner/**  /admin/**</text>
    <text x="20" y="948" fill="#64748B" font-size="11">18</text>
    <text x="340" y="948" fill="#0F172A">1. extraire token   2. signature + expiration   3. UserDetails   4. SecurityContext   5. hasRole(...)</text>
    <text x="20" y="978" fill="#64748B" font-size="11">19</text>
    <line x1="585" y1="974" x2="330" y2="974" stroke="#64748B" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#r)"/>
    <text x="360" y="968" fill="#64748B">200  ou  403 Forbidden selon le rôle</text>
  </g>

  <rect x="30" y="1020" width="1340" height="140" rx="8" fill="#F8FAFC" stroke="#1A2332"/>
  <text x="50" y="1044" font-family="Arial" font-size="13" font-weight="700" fill="#111827">Critères séquence UML + points jury</text>
  <text x="50" y="1068" font-family="Arial" font-size="12" fill="#0F172A">• Trait plein = appel synchrone. Pointillés = retour. Barre implicite = activation du service le temps du traitement.</text>
  <text x="50" y="1090" font-family="Arial" font-size="12" fill="#0F172A">• alt : deux issues (échec métier / succès). Un ADMIN ne peut pas s'inscrire via /register (sécurité).</text>
  <text x="50" y="1112" font-family="Arial" font-size="12" fill="#0F172A">• JWT stateless : pas de session serveur. Le rôle (FAN_USER / BUSINESS_OWNER / ADMIN) est DANS le token.</text>
  <text x="50" y="1134" font-family="Arial" font-size="12" fill="#065F46" font-weight="700">Mot de passe : BCrypt, jamais en clair. Fan : ville obligatoire à l'inscription.</text>
</svg>
