<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1680" width="1500" height="1680">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F9F58"/>
    </marker>
    <marker id="rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1500" height="1680" fill="#FFFFFF"/>
  <rect width="1500" height="60" fill="#111827"/>
  <text x="750" y="26" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#FFFFFF">Diagramme de séquence — Réservation + Stripe + ticket QR</text>
  <text x="750" y="48" text-anchor="middle" font-family="Arial" font-size="12" fill="#A7F3D0">Scénario principal Fan  ·  UML 2.5  ·  include Auth, match, café, dispo, paiement, ticket  ·  commission 25 %</text>

  <g font-family="Arial" font-size="12" text-anchor="middle">
    <rect x="30" y="76" width="100" height="46" rx="6" fill="#ECFDF3" stroke="#0F9F58"/>
    <text x="80" y="104" font-weight="700" fill="#065F46">Fan</text>
    <rect x="200" y="76" width="150" height="46" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="275" y="96" font-weight="700">Frontend</text>
    <text x="275" y="112" fill="#64748B">React</text>
    <rect x="430" y="76" width="180" height="46" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="520" y="96" font-weight="700">API Spring Boot</text>
    <text x="520" y="112" fill="#64748B">BookingService</text>
    <rect x="700" y="76" width="150" height="46" rx="4" fill="#F1F5F9" stroke="#1A2332"/>
    <text x="775" y="104" font-weight="700">PostgreSQL</text>
    <rect x="940" y="76" width="140" height="46" rx="4" fill="#FCE7F3" stroke="#BE185D"/>
    <text x="1010" y="104" font-weight="700" fill="#BE185D">Stripe</text>
    <rect x="1160" y="76" width="170" height="46" rx="4" fill="#F8FAFC" stroke="#1A2332"/>
    <text x="1245" y="96" font-weight="700">TicketPdfService</text>
    <text x="1245" y="112" fill="#64748B">ZXing + OpenPDF</text>
  </g>
  <g stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="80" y1="122" x2="80" y2="1500"/>
    <line x1="275" y1="122" x2="275" y2="1500"/>
    <line x1="520" y1="122" x2="520" y2="1500"/>
    <line x1="775" y1="122" x2="775" y2="1500"/>
    <line x1="1010" y1="122" x2="1010" y2="1500"/>
    <line x1="1245" y1="122" x2="1245" y2="1500"/>
  </g>

  <rect x="20" y="136" width="1320" height="24" rx="3" fill="#111827"/>
  <text x="680" y="153" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFFFFF">Préconditions : JWT Fan  ·  café APPROVED  ·  match non FINISHED</text>

  <g font-family="Arial" font-size="12">
    <text x="8" y="186" fill="#94A3B8" font-size="10">1</text>
    <line x1="80" y1="182" x2="275" y2="182" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="95" y="176">choisit un match</text>
    <text x="8" y="214" fill="#94A3B8" font-size="10">2</text>
    <line x1="275" y1="210" x2="520" y2="210" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="204">GET /matches</text>
    <text x="8" y="242" fill="#94A3B8" font-size="10">3</text>
    <line x1="520" y1="238" x2="775" y2="238" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="535" y="232">SELECT football_matches</text>
    <text x="8" y="270" fill="#94A3B8" font-size="10">4</text>
    <line x1="775" y1="266" x2="275" y2="266" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="400" y="260" fill="#64748B">liste matchs (déjà sync API)</text>

    <text x="8" y="300" fill="#94A3B8" font-size="10">5</text>
    <line x1="80" y1="296" x2="275" y2="296" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="95" y="290">choisit café + espace + table + partySize</text>
    <text x="8" y="328" fill="#94A3B8" font-size="10">6</text>
    <line x1="275" y1="324" x2="520" y2="324" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="318">GET tables (business, space, match)</text>
    <text x="8" y="356" fill="#94A3B8" font-size="10">7</text>
    <line x1="520" y1="352" x2="775" y2="352" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="535" y="346">table active ? déjà PENDING/CONFIRMED ?</text>
    <text x="8" y="384" fill="#94A3B8" font-size="10">8</text>
    <line x1="775" y1="380" x2="275" y2="380" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="400" y="374" fill="#64748B">tables + available + matchDayPrice</text>
  </g>

  <rect x="20" y="400" width="1320" height="24" rx="3" fill="#111827"/>
  <text x="680" y="417" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFFFFF">Création réservation PENDING + Payment PENDING</text>

  <g font-family="Arial" font-size="12">
    <text x="8" y="450" fill="#94A3B8" font-size="10">9</text>
    <line x1="80" y1="446" x2="275" y2="446" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="95" y="440">confirmer la réservation</text>
    <text x="8" y="478" fill="#94A3B8" font-size="10">10</text>
    <line x1="275" y1="474" x2="520" y2="474" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="468">POST /fan/bookings</text>
    <text x="8" y="506" fill="#94A3B8" font-size="10">11</text>
    <text x="290" y="506">JWT→User  ·  Business APPROVED  ·  Match réservable  ·  partySize ≤ capacity table</text>
  </g>

  <rect x="250" y="518" width="900" height="88" rx="4" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-dasharray="5 3"/>
  <text x="262" y="536" font-family="Arial" font-size="11" font-weight="700" fill="#D97706">alt  [table prise / match fini / partySize]   else   [OK]</text>
  <g font-family="Arial" font-size="12">
    <text x="8" y="560" fill="#94A3B8" font-size="10">12</text>
    <line x1="520" y1="556" x2="275" y2="556" stroke="#DC2626" stroke-width="1.3" marker-end="url(#rf)"/>
    <text x="300" y="550" fill="#DC2626">400 BusinessException</text>
    <text x="8" y="588" fill="#94A3B8" font-size="10">13</text>
    <text x="290" y="588">PaymentCalculator : fee = prix × 0,25   payout = prix − fee</text>
  </g>
  <g font-family="Arial" font-size="12">
    <text x="8" y="628" fill="#94A3B8" font-size="10">14</text>
    <line x1="520" y1="624" x2="775" y2="624" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="535" y="618">INSERT Reservation PENDING + Payment PENDING MAD</text>
    <text x="8" y="656" fill="#94A3B8" font-size="10">15</text>
    <line x1="775" y1="652" x2="275" y2="652" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="360" y="646" fill="#64748B">reservationId  status=PENDING</text>
  </g>

  <rect x="20" y="672" width="1320" height="24" rx="3" fill="#111827"/>
  <text x="680" y="689" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFFFFF">Paiement  —  Stripe (PCI-DSS, la carte ne transite PAS par FanConnect)</text>

  <g font-family="Arial" font-size="12">
    <text x="8" y="722" fill="#94A3B8" font-size="10">16</text>
    <line x1="275" y1="718" x2="520" y2="718" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="712">POST /fan/bookings/{id}/payment-intent</text>
  </g>

  <rect x="250" y="736" width="900" height="220" rx="4" fill="#FDF2F8" fill-opacity="0.6" stroke="#BE185D" stroke-dasharray="5 3"/>
  <text x="262" y="754" font-family="Arial" font-size="11" font-weight="700" fill="#BE185D">alt  [Stripe configuré sk_ + pk_]                            else  <<extend>> paiement simulé</text>

  <g font-family="Arial" font-size="12">
    <text x="8" y="780" fill="#94A3B8" font-size="10">17</text>
    <line x1="520" y1="776" x2="1010" y2="776" stroke="#BE185D" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="540" y="770">PaymentIntent.create  amount en centimes  currency=MAD  metadata.reservationId</text>
    <text x="8" y="808" fill="#94A3B8" font-size="10">18</text>
    <line x1="1010" y1="804" x2="520" y2="804" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="620" y="798" fill="#64748B">clientSecret + paymentIntentId</text>
    <text x="8" y="836" fill="#94A3B8" font-size="10">19</text>
    <line x1="80" y1="832" x2="275" y2="832" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="95" y="826">saisit la carte (Stripe.js)</text>
    <text x="8" y="864" fill="#94A3B8" font-size="10">20</text>
    <line x1="275" y1="860" x2="1010" y2="860" stroke="#BE185D" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="400" y="854">confirmer le PaymentIntent</text>
    <text x="8" y="892" fill="#94A3B8" font-size="10">21</text>
    <line x1="1010" y1="888" x2="275" y2="888" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="500" y="882" fill="#64748B">succeeded</text>
    <text x="8" y="920" fill="#94A3B8" font-size="10">22</text>
    <line x1="275" y1="916" x2="520" y2="916" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="910">POST .../pay { paymentIntentId }</text>
    <text x="8" y="946" fill="#94A3B8" font-size="10">23</text>
    <line x1="520" y1="942" x2="1010" y2="942" stroke="#BE185D" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="540" y="936">retrieve(id) — on NE FAIT PAS confiance au front</text>
  </g>

  <g font-family="Arial" font-size="12">
    <text x="8" y="986" fill="#94A3B8" font-size="10">24</text>
    <text x="290" y="986">Vérif metadata.reservationId == id  ·  status == succeeded  ·  sinon 400</text>
    <text x="8" y="1016" fill="#94A3B8" font-size="10">25</text>
    <line x1="520" y1="1012" x2="775" y2="1012" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="535" y="1006">Payment=PAID  ·  Reservation=CONFIRMED  ·  ticketCode=FC-XXXXXXXX</text>
    <text x="8" y="1044" fill="#94A3B8" font-size="10">26</text>
    <text x="290" y="1044">Notifications : fan (paiement OK)  ·  owner (nouvelle résa)  ·  admin (commission 25 %)</text>
    <text x="8" y="1072" fill="#94A3B8" font-size="10">27</text>
    <line x1="520" y1="1068" x2="275" y2="1068" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="300" y="1062" fill="#64748B">PaymentResponse + ticketCode</text>
  </g>

  <rect x="20" y="1090" width="1320" height="24" rx="3" fill="#111827"/>
  <text x="680" y="1107" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFFFFF">Ticket QR   <<extend>>  téléchargement PDF</text>

  <g font-family="Arial" font-size="12">
    <text x="8" y="1140" fill="#94A3B8" font-size="10">28</text>
    <line x1="80" y1="1136" x2="275" y2="1136" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="95" y="1130">télécharger le PDF</text>
    <text x="8" y="1168" fill="#94A3B8" font-size="10">29</text>
    <line x1="275" y1="1164" x2="520" y2="1164" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="290" y="1158">GET /fan/bookings/{id}/ticket.pdf</text>
    <text x="8" y="1196" fill="#94A3B8" font-size="10">30</text>
    <line x1="520" y1="1192" x2="1245" y2="1192" stroke="#0F9F58" stroke-width="1.5" marker-end="url(#af)"/>
    <text x="540" y="1186">generateTicketPdf  QR = FANCONNECT|TICKET|FC-XXXXXXXX</text>
    <text x="8" y="1224" fill="#94A3B8" font-size="10">31</text>
    <line x1="1245" y1="1220" x2="80" y2="1220" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#rf)"/>
    <text x="400" y="1214" fill="#64748B">PDF  ·  match, café, table, partySize, QR</text>
  </g>

  <rect x="20" y="1250" width="1460" height="410" rx="8" fill="#F8FAFC" stroke="#1A2332"/>
  <text x="40" y="1276" font-family="Arial" font-size="14" font-weight="700" fill="#111827">Critères UML + ce que le jury doit entendre</text>
  <text x="40" y="1304" font-family="Arial" font-size="13" fill="#0F172A">1. Fragments : alt (erreurs métier, Stripe vs simulé)  ·  extend PDF (optionnel)  ·  messages numérotés  ·  retours en pointillés.</text>
  <text x="40" y="1328" font-family="Arial" font-size="13" fill="#0F172A">2. Include du cas « Réserver » : on ne crée la résa qu'après Auth + match + café + table libre. Le paiement est inclus : pas de ticket sans PAID.</text>
  <text x="40" y="1352" font-family="Arial" font-size="13" fill="#0F172A">3. Stripe acteur secondaire : PaymentIntent (centimes MAD) + metadata reservationId. Vérification CÔTÉ SERVEUR (retrieve) — anti-fraude.</text>
  <text x="40" y="1376" font-family="Arial" font-size="13" fill="#0F172A">4. Commission : platformFee = 25 %  ·  ownerPayout = 75 %. Devise MAD. Mode simulé si clés absentes (démo soutenance).</text>
  <text x="40" y="1400" font-family="Arial" font-size="13" fill="#0F172A">5. Identifiant ticket : FC- + 8 caractères UUID. Payload QR préfixé FANCONNECT|TICKET| pour le parser owner.</text>
  <text x="40" y="1424" font-family="Arial" font-size="13" fill="#0F172A">6. Contrainte table × match : existsByTableIdAndMatchIdAndStatusIn(PENDING, CONFIRMED) — une table, un match, une résa active.</text>
  <text x="40" y="1448" font-family="Arial" font-size="13" fill="#0F172A">7. Statuts : PENDING (créée, pas payée) → CONFIRMED (payée, ticket) → CHECKED_IN (QR scanné)  |  CANCELLED possible tant que pas check-in.</text>
  <text x="40" y="1476" font-family="Arial" font-size="13" font-weight="700" fill="#065F46">Phrase : « Le fan ne touche jamais la carte côté serveur. Stripe encaisse, on revérifie le PaymentIntent, puis on confirme et on émet le QR. »</text>
  <text x="40" y="1504" font-family="Arial" font-size="13" fill="#0F172A">Annulation (non dessinée) : CANCELLED + Payment REFUNDED si déjà PAID (statut métier, pas un refund Stripe automatique).</text>
  <text x="40" y="1528" font-family="Arial" font-size="13" fill="#0F172A">Lifelines = composants réels du code : BookingServiceImpl, StripePaymentServiceImpl, TicketPdfServiceImpl, PaymentCalculator.</text>
  <text x="40" y="1556" font-family="Arial" font-size="12" fill="#64748B">Fichiers : BookingServiceImpl.java  ·  StripePaymentServiceImpl.java  ·  TicketPdfServiceImpl.java  ·  PaymentCalculator.java  ·  TicketCodeParser.java</text>
</svg>
