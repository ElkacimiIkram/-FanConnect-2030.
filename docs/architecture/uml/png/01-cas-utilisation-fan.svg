  <text x="840" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#A7F3D0">FanConnect 2030  ·  UML 2.5  ·  <<include>> obligatoire   ·   <<extend>> conditionnel</text>

  <!-- Actor Fan -->
  <g transform="translate(70,430)">
