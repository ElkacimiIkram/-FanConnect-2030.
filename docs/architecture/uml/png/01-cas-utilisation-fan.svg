    <ellipse cx="430" cy="255" rx="118" ry="34" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="430" y="252" fill="#0F172A">S'authentifier</text>
    <text x="430" y="268" fill="#64748B" font-size="10">(JWT + rôle)</text>

    <ellipse cx="430" cy="345" rx="118" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="430" y="349" fill="#0F172A">Consulter les matchs</text>

    <ellipse cx="430" cy="430" rx="118" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="430" y="434" fill="#0F172A">Rechercher un café</text>

    <ellipse cx="430" cy="560" rx="130" ry="48" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2.2" filter="url(#sh)"/>
    <text x="430" y="548" font-weight="700" fill="#065F46">Réserver une table</text>
    <text x="430" y="564" font-size="9" fill="#047857">points d'ext. : aide FanBot</text>
    <text x="430" y="578" font-size="10" fill="#065F46">cœur métier</text>

    <ellipse cx="430" cy="690" rx="125" ry="36" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="430" y="686" fill="#0F172A">Gérer mes réservations</text>
    <text x="430" y="702" font-size="9" fill="#64748B">ext. : annulation</text>

    <ellipse cx="430" cy="790" rx="125" ry="30" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
    <text x="430" y="794" fill="#9A3412">Annuler une réservation</text>

    <ellipse cx="760" cy="345" rx="120" ry="32" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
    <text x="760" y="349" fill="#9A3412">Obtenir la prédiction IA</text>

    <ellipse cx="760" cy="430" rx="120" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="760" y="434" fill="#0F172A">Consulter l'occupation</text>

    <ellipse cx="760" cy="560" rx="125" ry="36" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh)"/>
    <text x="760" y="556" fill="#0F172A">Vérifier la disponibilité</text>
    <text x="760" y="572" font-size="10" fill="#64748B">table × match unique</text>

    <ellipse cx="760" cy="690" rx="118" ry="32" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
    <text x="760" y="694" fill="#9A3412">Consulter FanBot</text>

    <ellipse cx="1100" cy="560" rx="125" ry="42" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2" filter="url(#sh)"/>
    <text x="1100" y="552" font-weight="700" fill="#065F46">Payer en ligne</text>
    <text x="1100" y="568" font-size="9" fill="#047857">ext. : mode simulé</text>
    <text x="1100" y="582" font-size="10" fill="#065F46">commission 25 %</text>

    <ellipse cx="1100" cy="690" rx="118" ry="32" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
    <text x="1100" y="694" fill="#9A3412">Payer en mode simulé</text>

    <ellipse cx="1390" cy="560" rx="118" ry="42" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2" filter="url(#sh)"/>
    <text x="1390" y="552" font-weight="700" fill="#065F46">Obtenir le ticket QR</text>
    <text x="1390" y="568" font-size="9" fill="#047857">ext. : PDF</text>
    <text x="1390" y="582" font-size="10" fill="#065F46">FC-XXXXXXXX</text>

    <ellipse cx="1390" cy="690" rx="110" ry="30" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
    <text x="1390" y="694" fill="#9A3412">Télécharger le PDF</text>
  </g>

  <!-- Associations Fan -->
  <g stroke="#1A2332" stroke-width="1.3" fill="none">
    <line x1="142" y1="470" x2="312" y2="170"/>
    <line x1="142" y1="490" x2="312" y2="255"/>
    <line x1="142" y1="500" x2="312" y2="345"/>
    <line x1="142" y1="510" x2="312" y2="430"/>
    <line x1="142" y1="530" x2="300" y2="560"/>
    <line x1="142" y1="550" x2="305" y2="690"/>
  </g>
  <!-- secondary -->
  <line x1="548" y1="345" x2="1548" y2="210" stroke="#1D4ED8" stroke-width="1.2"/>
  <line x1="1225" y1="560" x2="1548" y2="560" stroke="#BE185D" stroke-width="1.2"/>
  <line x1="880" y1="345" x2="1548" y2="390" stroke="#6D28D9" stroke-width="1.2"/>

  <!-- INCLUDE dashed green -->
  <g stroke="#0F9F58" stroke-width="1.5" stroke-dasharray="7 4" fill="none">
    <line x1="430" y1="512" x2="430" y2="289" marker-end="url(#inc)"/>
    <line x1="400" y1="512" x2="400" y2="377" marker-end="url(#inc)"/>
    <line x1="400" y1="528" x2="400" y2="462" marker-end="url(#inc)"/>
    <line x1="560" y1="560" x2="635" y2="560" marker-end="url(#inc)"/>
    <line x1="560" y1="560" x2="975" y2="560" marker-end="url(#inc)"/>
    <line x1="1225" y1="560" x2="1272" y2="560" marker-end="url(#inc)"/>
    <line x1="548" y1="430" x2="640" y2="430" marker-end="url(#inc)"/>
  </g>
  <g font-family="Arial" font-size="10" fill="#0F9F58" font-weight="700">
    <text x="448" y="400" transform="rotate(-90 448 400)"><<include>></text>
    <text x="630" y="548"><<include>></text>
    <text x="820" y="548"><<include>></text>
    <text x="1235" y="548"><<include>></text>
    <text x="580" y="418"><<include>></text>
  </g>

  <!-- EXTEND dashed orange : from extension TO base -->
  <g stroke="#D97706" stroke-width="1.5" stroke-dasharray="7 4" fill="none">
    <line x1="760" y1="658" x2="520" y2="590" marker-end="url(#ext)"/>
    <line x1="430" y1="760" x2="430" y2="726" marker-end="url(#ext)"/>
    <line x1="1390" y1="660" x2="1390" y2="602" marker-end="url(#ext)"/>
    <line x1="1100" y1="658" x2="1100" y2="602" marker-end="url(#ext)"/>
    <line x1="760" y1="377" x2="760" y2="398" marker-end="url(#ext)"/>
  </g>
  <g font-family="Arial" font-size="10" fill="#D97706" font-weight="700">
    <text x="620" y="640"><<extend>> [aide]</text>
    <text x="448" y="750"><<extend>></text>
    <text x="1400" y="640"><<extend>></text>
    <text x="1110" y="640"><<extend>></text>
    <text x="772" y="390"><<extend>> [IA up]</text>
  </g>
  <text x="448" y="738" font-family="Arial" font-size="9" fill="#9A3412">[≠ CHECKED_IN]</text>
  <text x="1110" y="652" font-family="Arial" font-size="9" fill="#9A3412">[Stripe absent]</text>
  <text x="1400" y="652" font-family="Arial" font-size="9" fill="#9A3412">[PDF demandé]</text>

  <!-- Legend -->
  <rect x="40" y="910" width="1600" height="150" rx="8" fill="#F8FAFC" stroke="#1A2332"/>
  <text x="60" y="934" font-family="Arial" font-size="13" font-weight="700" fill="#111827">Critères UML 2.5 — à dire à l'oral</text>
  <text x="60" y="958" font-family="Arial" font-size="12" fill="#0F172A">• <<include>> (vert, flèche vers l'inclus) : exécuté TOUJOURS avec le cas de base. Réserver inclut Auth + Match + Café + Dispo + Paiement. Payer inclut Ticket.</text>
  <text x="60" y="980" font-family="Arial" font-size="12" fill="#0F172A">• <<extend>> (orange, flèche vers le cas de base) : optionnel, condition entre crochets. Check-in / PDF / FanBot / paiement simulé / IA.</text>
  <text x="60" y="1002" font-family="Arial" font-size="12" fill="#0F172A">• Généralisation : Fan est un Utilisateur (triangle blanc). Acteurs secondaires à droite : Stripe, football-data.org, Service IA.</text>
  <text x="60" y="1024" font-family="Arial" font-size="12" fill="#0F172A">• Point d'extension : zone indiquée dans le cas de base (aide FanBot, mode simulé, PDF). Association = trait plein acteur—cas.</text>
  <text x="60" y="1046" font-family="Arial" font-size="12" fill="#065F46" font-weight="700">Scénario principal : S'authentifier → Match → Café → Table libre → Payer (Stripe) → Ticket QR  |  Statuts PENDING → CONFIRMED → CHECKED_IN</text>
</svg>
