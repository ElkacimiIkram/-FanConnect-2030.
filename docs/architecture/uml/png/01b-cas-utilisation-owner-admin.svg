<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1080" width="1680" height="1080">
  <defs>
    <marker id="inc2" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10" fill="none" stroke="#0F9F58" stroke-width="1.6"/>
    </marker>
    <marker id="ext2" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10" fill="none" stroke="#D97706" stroke-width="1.6"/>
    </marker>
    <marker id="gen2" viewBox="0 0 14 12" refX="14" refY="6" markerWidth="11" markerHeight="10" orient="auto">
      <path d="M 0 0 L 14 6 L 0 12 z" fill="#FFFFFF" stroke="#1A2332" stroke-width="1.2"/>
    </marker>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1680" height="1080" fill="#FFFFFF"/>
  <rect width="1680" height="64" fill="#111827"/>
  <text x="840" y="28" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#FFFFFF">Diagramme de cas d'utilisation — Propriétaire &amp; Administrateur</text>
  <text x="840" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#A7F3D0">FanConnect 2030  ·  UML 2.5  ·  KYC  ·  validation  ·  check-in QR  ·  occupation live</text>

  <!-- Owner -->
  <g transform="translate(70,250)">
    <circle cx="36" cy="18" r="12" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2"/>
    <line x1="36" y1="30" x2="36" y2="68" stroke="#0F9F58" stroke-width="2"/>
    <line x1="16" y1="46" x2="56" y2="46" stroke="#0F9F58" stroke-width="2"/>
    <line x1="36" y1="68" x2="18" y2="100" stroke="#0F9F58" stroke-width="2"/>
    <line x1="36" y1="68" x2="54" y2="100" stroke="#0F9F58" stroke-width="2"/>
    <text x="36" y="122" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#065F46">Propriétaire</text>
    <text x="36" y="138" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748B">de café</text>
  </g>
  <!-- Admin -->
  <g transform="translate(70,700)">
    <circle cx="36" cy="18" r="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="36" y1="30" x2="36" y2="68" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="16" y1="46" x2="56" y2="46" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="36" y1="68" x2="18" y2="100" stroke="#1D4ED8" stroke-width="2"/>
    <line x1="36" y1="68" x2="54" y2="100" stroke="#1D4ED8" stroke-width="2"/>
    <text x="36" y="122" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#1D4ED8">Administrateur</text>
  </g>
  <!-- User gen -->
  <g transform="translate(70,80)">
    <circle cx="36" cy="14" r="10" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="24" x2="36" y2="50" stroke="#334155" stroke-width="2"/>
    <line x1="18" y1="36" x2="54" y2="36" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="50" x2="22" y2="72" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="50" x2="50" y2="72" stroke="#334155" stroke-width="2"/>
    <text x="36" y="92" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#1E293B">Utilisateur</text>
  </g>
  <line x1="106" y1="250" x2="106" y2="172" stroke="#1A2332" stroke-width="1.3" marker-end="url(#gen2)"/>
  <line x1="106" y1="700" x2="106" y2="172" stroke="#1A2332" stroke-width="1.3" marker-end="url(#gen2)"/>

  <rect x="200" y="88" width="1420" height="800" rx="8" fill="#FAFBFC" stroke="#1A2332" stroke-width="2"/>
  <text x="220" y="112" font-family="Arial" font-size="14" font-weight="700" fill="#1A2332">FanConnect 2030</text>

  <!-- Owner package -->
  <rect x="230" y="130" width="1360" height="380" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="250" y="154" font-family="Arial" font-size="13" font-weight="700" fill="#065F46">Espace Propriétaire</text>

  <g font-family="Arial" font-size="12" text-anchor="middle">
    <ellipse cx="430" cy="220" rx="125" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="430" y="224" fill="#0F172A">Créer un établissement</text>

    <ellipse cx="430" cy="320" rx="130" ry="38" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="430" y="316" fill="#0F172A">Déposer les documents KYC</text>
    <text x="430" y="332" font-size="10" fill="#64748B">CIN · RC · photo extérieure</text>

    <ellipse cx="760" cy="320" rx="130" ry="38" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2" filter="url(#sh2)"/>
    <text x="760" y="316" font-weight="700" fill="#065F46">Soumettre pour validation</text>
    <text x="760" y="332" font-size="10" fill="#047857">condition : 3 pièces présentes</text>

    <ellipse cx="1100" cy="220" rx="125" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1100" y="224" fill="#0F172A">Signaler l'occupation live</text>

    <ellipse cx="1100" cy="340" rx="135" ry="42" fill="#ECFDF3" stroke="#0F9F58" stroke-width="2" filter="url(#sh2)"/>
    <text x="1100" y="332" font-weight="700" fill="#065F46">Vérifier un ticket QR</text>
    <text x="1100" y="348" font-size="9" fill="#047857">point d'ext. : check-in</text>
    <text x="1100" y="362" font-size="10" fill="#065F46">ticket de SON café uniquement</text>

    <ellipse cx="1430" cy="340" rx="115" ry="36" fill="#FFF7ED" stroke="#D97706" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1430" y="336" fill="#9A3412">Effectuer le check-in</text>
    <text x="1430" y="352" font-size="10" fill="#9A3412">[ticket CONFIRMED]</text>
  </g>

  <!-- Admin package -->
  <rect x="230" y="530" width="1360" height="330" rx="6" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="250" y="554" font-family="Arial" font-size="13" font-weight="700" fill="#1D4ED8">Espace Administrateur</text>

  <g font-family="Arial" font-size="12" text-anchor="middle">
    <ellipse cx="430" cy="640" rx="125" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="430" y="644" fill="#0F172A">Consulter le dossier</text>

    <ellipse cx="760" cy="640" rx="140" ry="48" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" filter="url(#sh2)"/>
    <text x="760" y="628" font-weight="700" fill="#1E3A8A">Traiter une demande</text>
    <text x="760" y="644" font-size="9" fill="#1D4ED8">points d'ext. : acceptation / refus</text>
    <text x="760" y="660" font-size="10" fill="#1E3A8A">cas de base de la validation</text>

    <ellipse cx="1100" cy="620" rx="125" ry="34" fill="#FFF7ED" stroke="#D97706" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1100" y="616" fill="#9A3412">Approuver l'établissement</text>
    <text x="1100" y="632" font-size="10" fill="#9A3412">[dossier complet]</text>

    <ellipse cx="1100" cy="720" rx="125" ry="34" fill="#FFF7ED" stroke="#D97706" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1100" y="716" fill="#9A3412">Rejeter l'établissement</text>
    <text x="1100" y="732" font-size="10" fill="#9A3412">[non conforme] + motif</text>

    <ellipse cx="1430" cy="620" rx="120" ry="32" fill="#F8FAFC" stroke="#1A2332" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1430" y="624" fill="#0F172A">Superviser la plateforme</text>

    <ellipse cx="1430" cy="720" rx="120" ry="32" fill="#FFF7ED" stroke="#D97706" stroke-width="1.6" filter="url(#sh2)"/>
    <text x="1430" y="724" fill="#9A3412">Désactiver un café</text>
  </g>

  <!-- Owner associations -->
  <g stroke="#0F9F58" stroke-width="1.3" fill="none">
    <line x1="142" y1="310" x2="305" y2="220"/>
    <line x1="142" y1="330" x2="300" y2="320"/>
    <line x1="142" y1="350" x2="630" y2="320"/>
    <line x1="142" y1="300" x2="975" y2="220"/>
    <line x1="142" y1="360" x2="965" y2="340"/>
  </g>
  <!-- Admin associations -->
  <g stroke="#1D4ED8" stroke-width="1.3" fill="none">
    <line x1="142" y1="760" x2="630" y2="660"/>
    <line x1="142" y1="780" x2="1310" y2="620"/>
  </g>

  <!-- INCLUDE -->
  <g stroke="#0F9F58" stroke-width="1.6" stroke-dasharray="7 4" fill="none">
    <line x1="630" y1="320" x2="560" y2="320" marker-end="url(#inc2)"/>
    <line x1="620" y1="640" x2="555" y2="640" marker-end="url(#inc2)"/>
  </g>
  <text x="575" y="308" font-family="Arial" font-size="11" fill="#0F9F58" font-weight="700"><<include>></text>
  <text x="575" y="628" font-family="Arial" font-size="11" fill="#0F9F58" font-weight="700"><<include>></text>

  <!-- EXTEND -->
  <g stroke="#D97706" stroke-width="1.6" stroke-dasharray="7 4" fill="none">
    <line x1="1315" y1="340" x2="1235" y2="340" marker-end="url(#ext2)"/>
    <line x1="975" y1="620" x2="900" y2="628" marker-end="url(#ext2)"/>
    <line x1="975" y1="720" x2="880" y2="668" marker-end="url(#ext2)"/>
    <line x1="1430" y1="688" x2="1430" y2="652" marker-end="url(#ext2)"/>
  </g>
  <text x="1240" y="328" font-family="Arial" font-size="11" fill="#D97706" font-weight="700"><<extend>></text>
  <text x="930" y="608" font-family="Arial" font-size="11" fill="#D97706" font-weight="700"><<extend>></text>
  <text x="900" y="710" font-family="Arial" font-size="11" fill="#D97706" font-weight="700"><<extend>></text>
  <text x="1440" y="678" font-family="Arial" font-size="11" fill="#D97706" font-weight="700"><<extend>></text>

  <rect x="40" y="910" width="1600" height="150" rx="8" fill="#F8FAFC" stroke="#1A2332"/>
  <text x="60" y="934" font-family="Arial" font-size="13" font-weight="700" fill="#111827">Lecture orale — validation propriétaire</text>
  <text x="60" y="958" font-family="Arial" font-size="12" fill="#0F172A">1. Owner crée le café (PENDING, invisible). 2. Il dépose CIN + Registre de commerce + photo. 3. Soumettre <<include>> Déposer documents (refus si pièce manquante).</text>
  <text x="60" y="980" font-family="Arial" font-size="12" fill="#0F172A">4. Admin « Traiter une demande » <<include>> Consulter le dossier. 5. Approuver <<extend>> si dossier complet (status APPROVED + géocodage). 6. Rejeter <<extend>> + motif (le owner corrige).</text>
  <text x="60" y="1002" font-family="Arial" font-size="12" fill="#0F172A">Check-in <<extend>> Vérifier ticket : on peut scanner sans valider l'entrée ; le check-in n'est possible que si CONFIRMED (payé) et pas déjà utilisé.</text>
  <text x="60" y="1024" font-family="Arial" font-size="12" fill="#065F46" font-weight="700">Règle produit : seuls les BusinessStatus = APPROVED apparaissent aux fans et acceptent une réservation.</text>
  <text x="60" y="1046" font-family="Arial" font-size="12" fill="#0F172A">Désactiver <<extend>> Superviser : sanction admin (DISABLED) — le café disparaît du Match Center.</text>
</svg>
